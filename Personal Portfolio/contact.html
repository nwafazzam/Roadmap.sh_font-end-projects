        <form>
            <div id="left-column">

            <div id="right-column">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" placeholder="What do you need?" required></textarea>
            </div>

            <button type="submit" id="submitBtn">Send Message</button>
